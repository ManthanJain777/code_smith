server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: sih26100-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://ep-dawn-cell-b377xf50-pooler.c-4.ap-southeast-1.aws.neon.tech/neondb?sslmode=require}}
    username: ${POSTGRES_USER:neondb_owner}
    password: ${POSTGRES_PASSWORD:npg_qISke7Erx6ho}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    hikari:
      max-lifetime: 60000
      connection-timeout: 30000
      keepalive-time: 30000
      idle-timeout: 30000
      minimum-idle: 2
      maximum-pool-size: 10
  jpa:
    database-platform: ${JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    clean-disabled: false
    clean-on-validation-error: false
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:GeM_Compliance_SecretKey_2026_Secure_Rotated_Token_Signing_Key_9918273645}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.8-flash}
  blockchain:
    enabled: ${BLOCKCHAIN_ENABLED:true}
    rpc-url: ${BLOCKCHAIN_RPC_URL:http://localhost:8545}
    contract-address: ${BLOCKCHAIN_CONTRACT_ADDRESS:0x5FbDB2315678afecb367f032d93F642f64180aa3}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
