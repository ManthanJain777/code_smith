server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: sih26100-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:demo}
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/sih26100_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${POSTGRES_USER:sa}
    password: ${POSTGRES_PASSWORD:sa}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: ${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
  flyway:
    enabled: true
    baseline-on-migrate: true
    clean-disabled: false
    clean-on-validation-error: false
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  jwt:
    secret: ${JWT_SECRET:GeM_Compliance_SecretKey_2026_Secure_Rotated_Token_Signing_Key_9918273645}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
  gemini:
    api-key: ${GEMINI_API_KEY:${GOOGLE_API_KEY:}}
    model: ${GEMINI_MODEL:gemini-3.8-flash}
  blockchain:
    enabled: ${BLOCKCHAIN_ENABLED:true}
    rpc-url: ${BLOCKCHAIN_RPC_URL:http://localhost:8545}
    contract-address: ${BLOCKCHAIN_CONTRACT_ADDRESS:0x5FbDB2315678afecb367f032d93F642f64180aa3}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
