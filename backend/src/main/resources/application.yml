server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: sih26100-backend
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:sih26100_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${POSTGRES_USER:sih_admin}
    password: ${POSTGRES_PASSWORD:sih_secure_password_2026}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
  blockchain:
    enabled: ${BLOCKCHAIN_ENABLED:true}
    rpc-url: ${BLOCKCHAIN_RPC_URL:http://localhost:8545}
    contract-address: ${BLOCKCHAIN_CONTRACT_ADDRESS:0x5FbDB2315678afecb367f032d93F642f64180aa3}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
